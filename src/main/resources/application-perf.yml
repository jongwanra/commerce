spring:
  application:
    name: hhplus
  datasource:
    url: jdbc:mysql://mysql:3306/hhplus?characterEncoding=UTF-8&serverTimezone=UTC
    username: application
    password: application
    name: HangHaePlusDataSource
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 50
      minimum-idle: 47
      connection-timeout: 3000 # 30초 대기는 장애 상황입니다. 30 -> 3초로 변경
      max-lifetime: 1800000 # 30분
      leak-detection-threshold: 60000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none

    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC
      hibernate:
        show_sql: false
        format_sql: false
        default_batch_fetch_size: 1000
  data:
    redis:
      host: redis
      port: 6379
    cache:
      type: redis
  kafka:
    bootstrap-servers: broker1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest # 처음 Kafka를 실행할 때, 처음 메시지 부터 읽음
      enable-auto-commit: false # 수동 commit
    listener:
      ack-mode: manual # 명시적으로 제어
      concurrency: 3 # 병렬 처리 Consumer 수
  task:
    execution:
      pool:
        core-size: 50
        max-size: 100
        # 2,000명이 몰려도 다 받을 수 있도록 넉넉히 설정
        queue-capacity: 2000

server:
  tomcat:
    threads:
      max: 200
      min-spare: 20 # 항상 대기하는 스레드 수
    accept-count: 500 # 대기열 큐는 Thread Pool의 2-3배 정도가 적절합니다.
    connection-timeout: 5000 # 5초 동안 처리하지 못할 경우 빠르게 503을 응답하는 것이 시스템 보호에 유리합니다.
